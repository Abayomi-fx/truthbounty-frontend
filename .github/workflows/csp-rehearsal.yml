name: CSP production rehearsal

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full reviewed SHA at the tip of upstream csp-rehearsal
        required: true
        type: string

permissions:
  contents: read

jobs:
  rehearsal:
    if: github.repository == 'DigiNodes/truthbounty-frontend' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers and deployment-branch restrictions must be configured
    # by an upstream administrator before enabling this environment.
    environment: csp-rehearsal
    steps:
      - name: Require activation and an approved upstream candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          APPROVED_SHA: ${{ vars.CSP_APPROVED_SHA }}
          ACTIVATED: ${{ vars.CSP_REHEARSAL_ACTIVATED }}
        run: |
          set -euo pipefail
          [[ "$ACTIVATED" == true ]] || { echo '::error::Task not activated'; exit 1; }
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Full SHA required'; exit 1; }
          [[ "$REVIEWED_SHA" == "$APPROVED_SHA" ]] || { echo '::error::SHA not approved'; exit 1; }
          candidate=$(gh api repos/DigiNodes/truthbounty-frontend/git/ref/heads/csp-rehearsal --jq .object.sha)
          [[ "$candidate" == "$REVIEWED_SHA" ]] || { echo '::error::Candidate is not the reviewed upstream branch tip'; exit 1; }
          printf 'Selected candidate: `%s`\n' "$REVIEWED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DigiNodes/truthbounty-frontend
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable pnpm && pnpm install --frozen-lockfile
      - run: pnpm verify:providers && pnpm test:providers
      - run: pnpm lint && pnpm type-check && pnpm test --runInBand
      - run: pnpm exec playwright install --with-deps chromium
      - name: Production CSP integration (no mocked fallback)
        env:
          CSP_FLOW_PROFILE: ${{ vars.CSP_FLOW_PROFILE }}
          CSP_STORAGE_STATE_JSON: ${{ secrets.CSP_STORAGE_STATE_JSON }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_OPTIMISM_RPC_URL: ${{ vars.NEXT_PUBLIC_OPTIMISM_RPC_URL }}
          NEXT_PUBLIC_OPTIMISM_SEPOLIA_RPC_URL: ${{ vars.NEXT_PUBLIC_OPTIMISM_SEPOLIA_RPC_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_WORLDCOIN_APP_ID: ${{ vars.NEXT_PUBLIC_WORLDCOIN_APP_ID }}
          NEXT_PUBLIC_WORLDCOIN_ACTION: ${{ vars.NEXT_PUBLIC_WORLDCOIN_ACTION }}
        run: |
          set -euo pipefail
          [[ -n "$CSP_FLOW_PROFILE" && -n "$NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID" ]] || {
            echo '::error::Canonical profile and real provider configuration required'
            exit 1
          }
          if [[ -n "$CSP_STORAGE_STATE_JSON" ]]; then
            umask 077
            CSP_STORAGE_STATE=$(mktemp "$RUNNER_TEMP/csp-session.XXXXXX")
            export CSP_STORAGE_STATE
            trap 'rm -f -- "$CSP_STORAGE_STATE"' EXIT
            printf '%s' "$CSP_STORAGE_STATE_JSON" > "$CSP_STORAGE_STATE"
          fi
          unset CSP_STORAGE_STATE_JSON
          # The configuration builds and starts this exact checkout in production.
          pnpm test:csp-browser
